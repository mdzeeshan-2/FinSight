spring:
  application:
    name: finsight-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finsight}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Kolkata

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:default-secret-change-in-production-min-32-chars}
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:llama-3.1-8b-instant}
  base-url: ${OPENAI_BASE_URL:https://api.groq.com/openai/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
