services:
  postgres:
    image: postgres:16-alpine
    container_name: finsight-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finsight
    ports:
      - "5432:5432"
    volumes:
      - finsight_pg_data:/var/lib/postgresql/data

volumes:
  finsight_pg_data:
